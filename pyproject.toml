[project]
name = "bambu-filament-list"
version = "0.1.0"
description = "Extract filament colours and types from Bambu Studio 3MF projects"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
bambu-filament-list = "filament_list:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["filament_list"]
